# Upstream maintainer grants.
#
# MAINTAINERS records who owns a file, not who receives pull requests for
# it. Each grant below gives the maintainers (M: and R:) of an existing
# MAINTAINERS section the same access as if the section listed `paths`:
# they can see and manage Sashiko bugs, and see embargoed review results and
# review transcripts, for changes to those paths. Nothing else changes: mail
# routing, the subsystems shown for a bug or patchset, and everything else
# keep following MAINTAINERS.
#
# `section` must be the title of an existing MAINTAINERS section; a grant
# whose section disappears upstream is dropped with an error at startup.
# `paths` use the MAINTAINERS F: syntax: a trailing slash covers the whole
# subtree, and * matches within one path component.
#
# Grants widen access to pre-disclosure material. Add one only at the
# request of, or with the agreement of, the section's maintainers, and say
# in the commit message who receives the pull requests for these paths.

# The SoC group receives pull requests from the platform maintainers for
# device trees, SoC drivers and firmware drivers.
# https://github.com/sashiko-dev/sashiko/issues/787
[[grant]]
section = "ARM AND ARM64 SoC SUB-ARCHITECTURES (COMMON PARTS)"
paths = ["arch/*/boot/dts/", "drivers/soc/", "drivers/firmware/"]
