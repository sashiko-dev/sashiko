# OrcaRouter, an OpenAI-compatible gateway. Export OPENAI_API_KEY with
# the OrcaRouter key.
# Setup: docs/llm-providers.md, section "OpenAI-Compatible Providers".

[ai]
provider = "openai-compatible"
model = "openai/gpt-4o-mini"

[ai.openai_compat]
base_url = "https://api.orcarouter.ai/v1"
context_window_size = 128000
max_tokens = 16384

[review]
concurrency = 4
