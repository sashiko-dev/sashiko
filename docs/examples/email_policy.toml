# Sashiko Mailing Lists & Email Policy Example
#
# By default, Sashiko loads `projects/<project>/mailing_lists.toml`
# (or the path configured via `review.email_policy_path`).
# Each section key is a mailing list email address, and omitted fields
# inherit from `[defaults]`.

[defaults]
# Whether listed mailing lists are tracked via NNTP by default.
track = true

# Hours to wait before publishing a review with findings.
embargo_hours = 2

# Who receives review emails when findings are present:
# - "author": patch author
# - "list": the mailing list itself
# - "recipients": individual non-mailing-list recipients from To/Cc
reply_to = ["author"]

# Who receives a review email when 0 issues are found:
# - "none": do not send email on clean reviews
# - "author": send positive review only to the patch author
# - "all": send positive review to normal reply_to + cc recipients
positive_review = "none"

# If true, completely mutes email notifications for this scope.
mute_all = true

# Static email addresses that should always receive a copy (CC'd).
cc = []

# Author email addresses whose submissions will never receive review emails.
ignored_emails = []

# --- Author-only delivery (inherits defaults when mute_all = false) ---
# ["intel-xe@lists.freedesktop.org"]
# mute_all = false

# --- Public list + author + CC'd individuals ---
# ["bpf@vger.kernel.org"]
# mute_all = false
# embargo_hours = 0
# subject_prefixes = ["bpf", "bpf-next"]
# reply_to = ["author", "list", "recipients"]

# --- Custom NNTP group override ---
# ["devicetree@vger.kernel.org"]
# nntp_group = "org.kernel.vger.linux-devicetree"

# --- Patchwork integration examples ---
#
# API mode: direct REST API calls with retry-queuing (3 attempts).
# Requires a maintainer API token (or SASHIKO_PATCHWORK_TOKEN env var).
#
# ["netdev@vger.kernel.org".patchwork]
# enabled = true
# api_url = "https://patchwork.kernel.org/api/1.3"
# token = "your-api-token"
# min_severity = "Medium"
# fail_severity = "High"
#
# Email mode: sends a structured notification email that a local script
# (e.g. pw_tools) can parse and use to post the check.
#
# ["linux-media@vger.kernel.org".patchwork]
# enabled = true
# email = "pw-bot@lists.example.org"
