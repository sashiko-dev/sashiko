# Direct OpenAI API backend: HTTP calls to
# https://api.openai.com/v1/chat/completions, no codex CLI. Billed per
# token against an API key rather than a Codex subscription.
#
# The key comes from the environment; there is no TOML field for it:
#   export OPENAI_API_KEY=sk-...     # LLM_API_KEY is also accepted
# Setup: docs/llm-providers.md, section "OpenAI-Compatible Providers".

[ai]
# Official API path; sends max_completion_tokens.
provider = "openai"
# The "gpt-5.6" alias resolves here; "gpt-5.6-terra" is cheaper.
model = "gpt-5.6-sol"

# The openai provider reads this table too. base_url and context_window_size
# are optional; set max_tokens as well. It is sent as max_completion_tokens,
# which on a reasoning model covers reasoning tokens as well as the reply, and
# it falls back to 4096 when this table is absent. That leaves a reasoning
# model little room for a reply once it has spent part of the budget thinking.
#
# Both settings below are pitched at the reasoning model named above. A
# gpt-5.6 chat completion that carries function tools, which a review does,
# accepts only "none"; a higher level fails those requests with a 400. Comment
# out effort if you switch to a non-reasoning model such as gpt-4o: those
# reject reasoning_effort outright rather than ignoring it.
[ai.openai_compat]
# Output cap, sent as max_completion_tokens.
max_tokens = 65536
# Sent as reasoning_effort; the valid set is model-dependent.
effort = "none"
# Derived from the model; set only to override.
# base_url = "https://api.openai.com/v1/chat/completions"
# Generic fallback for gpt-5.x; raise to the model's real window.
# context_window_size = 128000
# Set api = "responses" for the other endpoint; see
# Settings.openai-responses.toml.

[review]
concurrency = 4
