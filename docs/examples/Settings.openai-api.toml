# Direct OpenAI API backend: HTTP calls to https://api.openai.com/v1/responses,
# no codex CLI. Billed per token against an API key rather than a Codex
# subscription.
#
# The key comes from the environment; there is no TOML field for it:
#   export OPENAI_API_KEY=sk-...     # LLM_API_KEY is also accepted
[ai]
provider = "openai"        # official API path; targets the /v1/responses endpoint
model = "gpt-5.6-terra"

[ai.openai]
max_tokens = 65536
reasoning_effort = "medium"  # GPT-5.6 model default
# base_url = "https://api.openai.com/v1/responses"  # auto-derived; set only to override
# context_window_size = 1050000  # GPT-5.6 context window; its maximum output is 128000
