# Local Zephyr review with the Claude Code CLI (subscription auth, no API
# key). Setup: docs/zephyr-review.md.

[project]
kind = "zephyr"

[ai]
provider = "claude-cli"
model = "sonnet"
max_input_tokens = 180000
max_interactions = 150

[review]
# Each review spawns many CLI processes; lower this on rate limits.
concurrency = 2
