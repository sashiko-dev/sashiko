[ai]
# Can be "openai" or "openai-compatible"
provider = "openai-compatible"
model = "gemma-xyz"

[ai.openai_compat]
base_url = "http://localhost:8080/v1"
context_window_size = 8192
max_tokens = 2048
# Sent as the reasoning_effort request field. Left unset the field is omitted,
# which is what an endpoint that does not implement it needs -- some reject
# the whole request over an unknown field. Set it only for a reasoning model on an
# endpoint documented to accept it, and raise max_tokens above when you do:
# an endpoint that spends reasoning tokens from that same cap returns an empty
# reply once thinking exhausts it, which the run reports as truncated output.
# effort = "medium"

# Send a thinking model's reasoning back as reasoning_content on later
# assistant turns. DeepSeek and Kimi reject a tool-call follow-up without
# it; leave it off for endpoints that reject unknown message fields.
# send_reasoning_content = true
