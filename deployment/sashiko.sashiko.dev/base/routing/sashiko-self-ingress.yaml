# Stable IPv4 Ingress
#
# Both sashiko.sashiko.dev (port 8080) and gcc.sashiko.dev (port 8081) resolve
# to lb-ipv4-bugrepo (136.110.177.184) and are routed by host header through
# this shared Ingress in the sashiko-self namespace.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sashiko-self-ingress
  namespace: sashiko-self
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "lb-ipv4-bugrepo"
    networking.gke.io/managed-certificates: "sashiko-self-cert,sashiko-gcc-cert"
spec:
  defaultBackend:
    service:
      name: sashiko-self-service
      port:
        number: 8080
  rules:
    - host: sashiko.sashiko.dev
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: sashiko-self-service
                port:
                  number: 8080
    - host: gcc.sashiko.dev
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: sashiko-gcc-service
                port:
                  number: 8081
