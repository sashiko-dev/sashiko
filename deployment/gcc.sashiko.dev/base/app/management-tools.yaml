apiVersion: v1
kind: ConfigMap
metadata:
  name: sashiko-gcc-management-scripts
  namespace: sashiko-self
data:
  setup-env.sh: |
    #!/bin/sh
    set -e
    echo "--- Setting up environment at $(date) ---"
    apk add --no-cache sqlite bash
    echo "--- Environment setup complete ---"
  backup-db.sh: |
    #!/bin/bash
    set -e
    DB_PATH="/data/db/sashiko-gcc.db"
    BUCKET="${BACKUP_BUCKET:-gs://BACKUP_BUCKET}"
    TIMESTAMP=$(date '+%Y-%m-%d_%Hh-%Mm-%Ss-%Z')
    TEMP_BACKUP="/data/sashiko_gcc_backup.db"

    echo "--- Starting Backup at $(date) ---"

    if [ ! -f "$DB_PATH" ]; then
        echo "Error: Database not found at $DB_PATH"
        exit 1
    fi

    echo "Cleaning remaining artifacts just in case..."
    rm -f "$TEMP_BACKUP"

    echo "Creating consistent SQLite snapshot..."
    sqlite3 "$DB_PATH" "VACUUM INTO '$TEMP_BACKUP'"

    echo "Uploading to Cloud Storage..."
    gsutil cp "$TEMP_BACKUP" "${BUCKET}/sashiko_gcc_${TIMESTAMP}.db"

    echo "Cleaning up..."
    rm "$TEMP_BACKUP"

    echo "--- Backup Complete: sashiko_gcc_${TIMESTAMP}.db ---"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sashiko-gcc-nightly-backup
  namespace: sashiko-self
spec:
  # Staggered an hour after sashiko-self (04:00) and two hours after the main
  # Linux instance (03:00) so the backups never contend for disk or network.
  schedule: "0 5 * * *"
  timeZone: "America/Los_Angeles"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: sashiko-self-ksa
          nodeSelector:
            cloud.google.com/gke-nodepool: pool-256gb
          containers:
            - name: backup-worker
              image: google/cloud-sdk:alpine
              command:
                - "/bin/sh"
                - "-c"
                - "/usr/local/bin/setup-env.sh && /usr/local/bin/backup-db.sh"
              volumeMounts:
                - name: sashiko-self-storage
                  mountPath: /data
                  subPath: data-dir
                - name: scripts
                  mountPath: /usr/local/bin/backup-db.sh
                  subPath: backup-db.sh
                - name: scripts
                  mountPath: /usr/local/bin/setup-env.sh
                  subPath: setup-env.sh
          restartPolicy: OnFailure
          volumes:
            - name: sashiko-self-storage
              persistentVolumeClaim:
                claimName: sashiko-self-data-pvc
            - name: scripts
              configMap:
                name: sashiko-gcc-management-scripts
                defaultMode: 0755
