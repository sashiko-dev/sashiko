# Sashiko daemon configuration, as shipped in the container image.
# Every key with its default: docs/configuration.md.
# Other LLM providers: docs/llm-providers.md and docs/examples/.
# Environment variables override any key, e.g. SASHIKO__SERVER__PORT=8081.

log_level = "info"

[project]
name = "Sashiko"
description = ""

[forge]
enabled = false
# provider = "github"
# Reviews are posted back to GitHub only with post_mode = "live"
# ("dry_run" records them without posting). See
# docs/examples/Settings.forge-github.toml.
# post_mode = "off"
# api_token = "your-api-token"
# Authenticates incoming webhooks, which lets non-localhost senders in
# without --enable-unsafe-all-submit. Generate one with
# openssl rand -hex 32; see docs/WEBHOOK_SECURITY.md.
# webhook_secret = ""

# GitHub repositories ("owner/repo") to reconcile via periodic Pulls REST API
# polling (or set SASHIKO__FORGE__REPOS="owner/repo1,owner/repo2"). When unset
# and forge.enabled = true, auto-detects the GitHub repository from the origin
# remote of git.repository_path.
# repos = ["sashiko-dev/sashiko"]
# Interval in seconds between periodic GitHub PR reconciliation passes
# (0 = disabled).
# poll_interval_secs = 120

[subsystems]
# Regex map: email address pattern -> subsystem name.
# mapping = [{ pattern = ".*netdev@vger.kernel.org.*", name = "netdev" }]

[database]
url = "sashiko.db"

[mailing_lists]
# Tracked lists come from projects/<project>/mailing_lists.toml. Setting
# track here (or SASHIKO__MAILING_LISTS__TRACK) overrides them.
# track = ["linux-kernel"]

[nntp]
server = "nntp.lore.kernel.org"
port = 119
# Wrap the session in TLS (NNTPS). Servers listen for NNTPS on 563.
# tls = false
# Maximum concurrent NNTP worker connections polling tracked mailing lists.
# concurrency = 4

# [smtp]
# **WARNING: BE VERY CAREFUL WHEN ENABLING EMAIL SENDING.**
# Sashiko can easily generate and send a large volume of automated emails to
# public mailing lists, potentially causing disruption or being marked as spam.
# Ensure your filters and dry_run settings are correctly configured before use.
# sender_address = "sashiko@example.com"
# dry_run = true
# The smtp transport requires implicit TLS, so name the submissions port
# rather than the STARTTLS port.
# transport = "smtp"
# server = "smtp.example.com"
# port = 465
# username = "user@example.com"
# password = "your_password"
# To hand mail to the local MTA instead, use transport = "sendmail"
# (and sendmail_path if it is not /usr/sbin/sendmail) without server,
# port, username or password.

[ai]
provider = "gemini"
model = "gemini-4-argon"
max_input_tokens = 900000
max_interactions = 100
temperature = 1.0
# max_rps = 1.0
# max_tpm = 1000000

[server]
host = "::"
port = 8080
# The URL this service is reachable at from outside, with no trailing slash.
# Required whenever [smtp] is configured, because sign-in links are mailed and
# the bind address above does not name a host a recipient can open. The server
# refuses to start if SMTP is on and this is unset or names a bind address.
# public_base_url = ""
# Signs sign-in links and sessions; sign-in is unavailable without it.
# Prefer SASHIKO__SERVER__JWT_SECRET to writing it here.
# jwt_secret = ""

# Capabilities of signed-in (JWT) identities. Empty lists grant nothing
# (fail-closed). Do NOT list arbitrary users here. Each list also accepts
# a comma separated string, e.g. SASHIKO__SERVER__ACL__ADMINS.
[server.acl]
# Admins have all capabilities, including root-level maintenance operations.
admins = []
# The kernel security list. Reads and comments on every bug and reads the raw
# AI transcripts. Deliberately not admins: this grants no ingest, cancel or
# review capability, and no authority over bugs outside the member's own
# maintained subsystems beyond commenting.
security = []
# Principals permitted to file new bugs over HTTP. Empty means only admins can.
bug_reporters = []
# May submit new patches into the system (/api/submit).
ingest = []
# May halt running workloads (useful for automation / cron scripts).
cancel = []
# May trigger intensive AI analyses of existing patches.
review = []
# Denies all capabilities and access, overriding any grants.
blocklist = []

[git]
repository_path = "third_party/linux"

# Track custom remotes and attempt to apply patches on their branches.
# [[git.custom_remotes]]
# name = "remote-name"
# url = "git://my-custom.com/remote"
# check_all_branches = true
# only_branches = []
# branch_patterns = ["linux-*.y", "net-*"]

[review]
concurrency = 16
worktree_dir = "review_trees"
timeout_seconds = 7200
max_retries = 3
# Preparation has a separate per-attempt deadline and retry budget.
# Each cleanup pauses that deadline and has its own 120-second budget.
# preparation_timeout_seconds = 1800
# preparation_max_retries = 3
ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore", "LICENSES/"]
# Reasoning effort on Gemini models: "low", "mid" (default on Gemini 4+),
# "high", or "dynamic". Ignored on non-Gemini providers.
# effort = "mid"
# Skip the model run for a patch whose diff matches, modulo rebase noise,
# a patch already reviewed with no findings. The patch gets a Skipped
# review that names the review it inherits from.
# skip_unchanged_clean = false
# Only reuse a clean review completed within this many days.
# skip_unchanged_clean_max_age_days = 90
# Reuse a clean review even when the model or prompts have changed.
# skip_unchanged_clean_any_model = false
# Reuse a clean review only when the baseline commit is the same and the
# patches ahead of it in the series are unchanged too.
# skip_unchanged_clean_require_same_baseline = false
# Default queue dispatch priority for patchsets (default: 500).
# default_priority = 500
# Sliding window duration in seconds for author batch submission deprioritization (default: 30).
# batch_window_secs = 30
# [[review.batch_tiers]]
# min_size = 10
# priority = 400
# [[review.batch_tiers]]
# min_size = 40
# priority = 300
# [[review.priority_rules]]
# regex = "(?i)^(\\[PATCH[^\\]]*\\]\\s*)?(CRITICAL|FIX|URGENT):"
# priority = 900

[linux_bug]
# Pre-existing bug tracking and the background bug worker. When disabled,
# pre-existing issues found during patch review are ignored.
enabled = false
# Maximum number of concurrent bug analyses run by the bug worker.
# concurrency = 4
# Periodically check whether open bugs have been fixed upstream.
fix_check_enabled = false
# Seconds between upstream fix checks against the mainline tree
# (0 = disabled).
# fix_check_interval_seconds = 21600
# Maximum number of open bugs evaluated per upstream fix check cycle.
# fix_check_batch_size = 50
# Evaluate canonical bugs for security importance (CVSS v4.0 + threat model)
# on discovery and via periodic background backfill sweeps.
# security_eval_enabled = true
# Seconds between periodic security evaluation backfill sweeps (0 = disabled).
# security_eval_interval_seconds = 60
# Maximum number of bugs evaluated per periodic security evaluation cycle.
# security_eval_batch_size = 25
