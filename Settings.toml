[server]
host = "::"
port = 8080
# The URL this service is reachable at from outside, with no trailing slash.
# Required whenever [smtp] is configured, because sign-in links are mailed and
# the bind address above does not name a host a recipient can open. The server
# refuses to start if SMTP is on and this is unset or names a bind address.
# public_base_url = ""

# Local tooling authenticates with a token rather than an address. The server
# writes a random one to .sashiko-local-token beside the database on every
# start, readable only by the user it runs as, and sashiko-cli and the
# benchmark present it automatically.
#
# Nothing is inferred from where a request comes from. The deployed topology
# puts a reverse proxy in front of a loopback bind, so a request from the
# public internet arrives exactly as a local one does; reading a file owned by
# the server's user is a claim that caller cannot make.

# Identity-based Capabilities: Defines what authenticated (JWT) entities can do.
# If these lists are empty or the section is missing, nobody is allowed to perform any mutations (Fail-Closed secure default).
# Do NOT list arbitrary users here.
[server.acl]
# Admins have all capabilities, including root-level maintenance operations.
admins = []
# The kernel security list. Reads and comments on every bug and reads the raw
# AI transcripts. Deliberately not admins: this grants no ingest, cancel or
# review capability, and no authority over bugs outside the member's own
# maintained subsystems beyond commenting.
security = []
# Principals permitted to file new bugs over HTTP. Empty means only admins can.
bug_reporters = []
# Ingest limits users/bots to only submit new patches into the system (/api/submit).
ingest = []
# Cancel permits halting workloads (useful for automation / cron scripts).
cancel = []
# Review allows triggering intensive AI analyses on existing patches.
review = []
# Blocklist explicitly denies all capabilities and access, overriding any grants.
blocklist = []

[git]
repository_path = "third_party/linux"

# Track custom remotes and attempt to apply patches on their branches
# [[git.custom_remotes]]
# name = "remote-name"
# url = "git://my-custom.com/remote"
# check_all_branches = true
# only_branches = []

[review]
concurrency = 16
worktree_dir = "review_trees"
timeout_seconds = 7200
max_retries = 3
ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore", "LICENSES/"]
