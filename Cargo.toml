[package]
name = "sashiko"
version = "0.4.3"
edition = "2024"
default-run = "sashiko"
description = "Agentic code review system for Linux kernel"
license = "Apache-2.0"
repository = "https://github.com/sashiko-dev/sashiko"
homepage = "https://sashiko.dev"
readme = "README.md"
keywords = ["linux", "kernel", "code-review", "ai", "llm"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
    "third_party/linux/",
    "llama.cpp/",
    "archives/",
    "review_trees/",
    "deployment/",
    "designs/",
    ".sashiko*",
    "*.log",
    "*.pid",
    "install.sh",
    "test_*.rs",
]

[lib]
doctest = false

[[bin]]
name = "sashiko"
path = "src/main.rs"

[[bin]]
name = "sashiko-cli"
path = "src/bin/sashiko-cli.rs"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
test = false
required-features = ["server"]

[features]
default = ["server"]
server = [
    "cache",
    "dep:libsql",
    "dep:flate2",
    "dep:axum",
    "dep:tower-http",
    "dep:jsonwebtoken",
    "dep:hmac",
    "dep:base64",
    "dep:url",
    "dep:percent-encoding",
    "dep:bytes",
    "dep:lettre",
    "dep:mail-parser",
    "dep:rustls-native-certs",
    "dep:tokio-rustls",
    "dep:tokio-util",
]
cache = ["dep:libsql"]
bedrock = ["aws-config", "aws-sdk-bedrockruntime", "aws-smithy-types"]
vertex = ["google-cloud-auth"]

[dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }
axum = { version = "0.8.9", optional = true }
bytes = { version = "1.9", optional = true }
chrono = "0.4.43"
clap = { version = "4.6.1", features = ["derive", "env"] }
config = "0.15.23"
google-cloud-auth = { version = "1.10", optional = true }
fastrand = "2.4.1"
flate2 = { version = "1.1.9", optional = true }
futures = "0.3.31"
lettre = { version = "0.11.7", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1", "tokio1-rustls-tls"], optional = true }
libsql = { version = "0.9.29", optional = true }
mail-parser = { version = "0.11.3", optional = true }
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["json", "query"] }
rustix = { version = "1.1.4", features = ["termios"] }
rustls-native-certs = { version = "0.8.4", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.24.0"
termcolor = "1.4.1"
terminfo = "0.9.0"
thiserror = "2.0.17"
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = { version = "0.26.4", optional = true }
tokio-util = { version = "0.7.17", features = ["codec", "io"], optional = true }
toml = "1.0"
tower-http = { version = "0.7.0", features = ["cors", "fs", "trace"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
hmac = { version = "0.13", optional = true }
base64 = { version = "0.23", optional = true }
subtle = "2"
url = { version = "2.5.8", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
uuid = { version = "1.23.4", features = ["v4"] }
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"], optional = true }

[dev-dependencies]
rcgen = "0.14"
# Self-signalling, to test what the display does when the terminal is resized.
rustix = { version = "1.1.4", features = ["process"] }

[profile.dev]
debug = 1
